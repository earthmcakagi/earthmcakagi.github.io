<h2 style="text-align: center;">NEWS</h2>
<style>
  /* ニュースエリア全体の枠組み設定 */
  .simple-news-box {
    width: 100%;
    max-width: 700px; /* 全体の横幅 */
    margin: 40px auto;
    padding: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc; /* 外枠の線 */
    background-color: #fff;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }

  /* 縦に伸びないためのスクロール設定 */
  .simple-news-scroll {
    max-height: 200px; /* ニュースエリアの最大の高さ */
    overflow-y: auto;  /* 縦方向にスクロールバーを自動表示 */
    padding-right: 5px;
  }

  /* 各ニュースの1行設定（リンク） */
  .simple-news-item {
    display: flex;
    align-items: center;
    padding: 10px 5px;
    border-bottom: 1px solid #eee; /* 行と行の間の区切り線 */
    text-decoration: none; /* リンクの下線を消す */
    color: #333; /* 文字色 */
    font-size: 0.9rem;
    gap: 15px; /* 要素同士の間隔 */
    transition: background-color 0.2s;
  }

  .simple-news-item:last-child {
    border-bottom: none; /* 最後の行の線は消す */
  }

  /* マウスを乗せたときの効果 */
  .simple-news-item:hover {
    background-color: #f5f5f5; /* 背景を薄いグレーに */
    color: #0056b3; /* 文字色を少し青っぽく（お好みで消してもOK） */
  }

  /* 日付のスタイル */
  .simple-news-date {
    color: #666;
    white-space: nowrap; /* 改行させない */
  }

  /* 角丸の四角ラベルのスタイル */
  .simple-news-label {
    background-color: #ff0000; /* ラベルの赤色 */
    color: #fff;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 4px; /* 四角の角をほどよく丸める設定 */
    white-space: nowrap; /* 改行させない */
  }

  /* タイトルのスタイル（長すぎる文字を自動で「...」にする） */
  .simple-news-title {
    margin: 0;
    white-space: nowrap;     /* 長すぎるテキストを1行に収める */
    overflow: hidden;        /* はみ出た部分を隠す */
    text-overflow: ellipsis; /* はみ出た文字の末尾を「...」にする */
    flex-grow: 1;            /* 横幅いっぱいに広げる */
    text-align: left;        /* 文字を左詰めに */
  }

  /* スマホ対応（画面が狭いとき） */
  @media (max-width: 500px) {
    .simple-news-item {
      gap: 10px;
      font-size: 0.8rem;
    }
    .simple-news-label {
      padding: 2px 6px;
    }
  }
</style>

<div class="simple-news-box">
  <div class="simple-news-scroll">
    
    <!-- ニュース1行目：リンク先URLを href="〜" に書き換えてください -->
    <a href="news01.html" class="simple-news-item">
      <time class="simple-news-date">2026.09.01</time>
      <span class="simple-news-label">ラベル</span>
      <p class="simple-news-title">ホームページをリニューアルしました。クリックすると詳細ページへ飛びます。</p>
    </a>

    <!-- ニュース2行目：新しいタブで開きたい場合は target="_blank" を付けます -->
    <a href="https://example.com" class="simple-news-item" target="_blank">
      <time class="simple-news-date">2026.08.25</time>
      <span class="simple-news-label">ラベル</span>
      <p class="simple-news-title">外部の参考サイトを新しいタブで開くテスト用ニュース</p>
    </a>

    <!-- ニュース3行目 -->
    <a href="news03.html" class="simple-news-item">
      <time class="simple-news-date">2026.08.15</time>
      <span class="simple-news-label">ラベル</span>
      <p class="simple-news-title">ここには新着情報のタイトルが入ります。長くなっても「...」で自動的に省略されます。</p>
    </a>

    <!-- ニュース4行目 -->
    <a href="news04.html" class="simple-news-item">
      <time class="simple-news-date">2026.08.01</time>
      <span class="simple-news-label">ラベル</span>
      <p class="simple-news-title">テスト用の新着情報テキストNO.4</p>
    </a>

    <!-- ニュース5行目（これ以降は枠内でスクロールして表示されます） -->
    <a href="news05.html" class="simple-news-item">
      <time class="simple-news-date">2026.07.20</time>
      <span class="simple-news-label">ラベル</span>
      <p class="simple-news-title">テスト用の新着情報テキストNO.5（スクロールすると見えます）</p>
    </a>

  </div>
</div>
