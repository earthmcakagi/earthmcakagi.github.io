<h2 style="text-align: center;">NEWS</h2>
<style>
  /* ニュースエリア全体の枠組み設定 */
  .simple-news-box {
    width: 100%;
    max-width: 700px; /* 全体の横幅 */
    margin: 40px auto;
    padding: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc; /* 外枠の線 */
    background-color: #fff;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }

  /* 縦に伸びないためのスクロール設定（ここがポイント） */
  .simple-news-scroll {
    max-height: 200px; /* 💡ニュースエリアの最大の高さ（これ以上増えるとスクロールします） */
    overflow-y: auto;  /* 💡縦方向にスクロールバーを自動表示 */
    padding-right: 5px;
  }

  /* 各ニュースの1行設定 */
  .simple-news-item {
    display: flex;
    align-items: center;
    padding: 10px 5px;
    border-bottom: 1px solid #eee; /* 行と行の間の区切り線 */
    text-decoration: none;
    color: #333;
    font-size: 0.9rem;
    gap: 15px; /* 要素同士の間隔 */
  }

  .simple-news-item:last-child {
    border-bottom: none; /* 最後の行の線は消す */
  }

  .simple-news-item:hover {
    background-color: #f9f9f9; /* マウスを乗せたときに背景を薄くグレーに */
  }

  /* 日付のスタイル */
  .simple-news-date {
    color: #666;
    white-space: nowrap; /* 改行させない */
  }

  /* 赤いラベルのスタイル */
  .simple-news-label {
    background-color: #ff0000; /* 赤色 */
    color: #fff;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 3px 12px;
    border-radius: 20px; /* 丸みのあるカプセル型 */
    white-space: nowrap; /* 改行させない */
  }

  /* タイトルのスタイル */
  .simple-news-title {
    margin: 0;
    white-space: nowrap;     /* 💡長すぎるテキストを1行に収める */
    overflow: hidden;        /* 💡はみ出た部分を隠す */
    text-overflow: ellipsis; /* 💡はみ出た文字の末尾を「...」にする */
    flex-grow: 1;            /* 横幅いっぱいに広げる */
    text-align: left;
  }

  /* スマホ対応（画面が狭いとき） */
  @media (max-width: 500px) {
    .simple-news-item {
      gap: 10px;
      font-size: 0.8rem;
    }
    .simple-news-label {
      padding: 2px 8px;
    }
  }
</style>

<div class="simple-news-box">
