<h2 style="text-align: center;">NEWS</h2>
<style>
  /* ニュースエリア全体の枠組み設定 */
  .simple-news-box {
    width: 100%;
    max-width: 700px;
    margin: 40px auto;
    padding: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    background-color: #fff;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }

  /* 縦に伸びないためのスクロール設定 */
  .simple-news-scroll {
    max-height: 200px;
    overflow-y: auto;
    padding-right: 5px;
  }

  /* 各ニュースの1行設定 */
  .simple-news-item {
    display: flex;
    align-items: center;
    padding: 10px 5px;
    border-bottom: 1px solid #eee;
    text-decoration: none;
    color: #333;
    font-size: 0.9rem;
    gap: 15px;
    transition: background-color 0.2s;
  }

  .simple-news-item:last-child {
    border-bottom: none;
  }

  .simple-news-item:hover {
    background-color: #f5f5f5;
  }

  /* 日付のスタイル */
  .simple-news-date {
    color: #666;
    white-space: nowrap;
  }

  /* 💡ベースとなるラベルのスタイル（共通） */
  .simple-news-label {
    color: #fff;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    background-color: #718096; /* 何も指定しない時はグレー */
  }

  /* 💡【追加】ラベルの種類ごとの色設定 */
  .simple-news-label.red { background-color: #ff0000; }    /* 赤 */
  .simple-news-label.blue { background-color: #007bff; }   /* 青 */
  .simple-news-label.green { background-color: #28a745; }  /* 緑 */
  .simple-news-label.orange { background-color: #fd7e14; } /* オレンジ */
   /* 💡新しく増やせるカラーバリエーション */
  .simple-news-label.purple { background-color: #6f42c1; } /* 紫：コミュニティ・Discordなど */
  .simple-news-label.pink   { background-color: #e83e8c; } /* ピンク：ショップ・限定・特典 */
  .simple-news-label.yellow { background-color: #ffc107; color: #333 !important; } /* 黄色：注目（文字は黒） */
  .simple-news-label.black  { background-color: #343a40; } /* 黒：終了・アーカイブ・その他 */
  .simple-news-label.cyan   { background-color: #17a2b8; } /* 水色：募集・アンケート */


  /* タイトルのスタイル */
  .simple-news-title {
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-grow: 1;
    text-align: left;
  }

  @media (max-width: 500px) {
    .simple-news-item { gap: 10px; font-size: 0.8rem; }
    .simple-news-label { padding: 2px 6px; }
  }
</style>

<div class="simple-news-box">
  <div class="simple-news-scroll">
    
    <!-- 💡使い方の例： class の中に「red」や「blue」を書き足します -->

    <!-- 青色ラベルのニュース -->

    <!-- 緑色ラベルのニュース -->
    <a href="news03.html" class="simple-news-item">

    </a>

    <!-- オレンジ色ラベルのニュース -->
    <a href="news04.html" class="simple-news-item">
