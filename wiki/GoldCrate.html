<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkagiEarthMCWiki</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #ffffff;
            color: #202122;
            margin: 0;
            padding: 0;
        }

        .wiki-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar-left {
            width: 220px;
            background-color: #f6f6f6;
            border-right: 1px solid #a2a9b1;
            padding: 20px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .sidebar-left ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-left li {
            margin-bottom: 12px;
            font-size: 14px;
        }
        .sidebar-left a {
            color: #0645ad;
            text-decoration: none;
        }
        .sidebar-left a:hover {
            text-decoration: underline;
        }
        .sidebar-left .child-menu {
            padding-left: 15px;
            font-size: 13px;
            color: #54595d;
        }

        .content-body {
            display: flex;
            flex-grow: 1;
            padding: 30px;
            gap: 30px;
            box-sizing: border-box;
        }

        .main-content {
            flex-grow: 1;
            min-width: 0;
        }
        .main-content h1 {
            font-size: 28px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #a2a9b1;
            padding-bottom: 5px;
        }
        .main-content h2 {
            font-size: 20px;
            font-weight: normal;
            margin-top: 30px;
            margin-bottom: 10px;
            border-bottom: 1px solid #eaecf0;
            padding-bottom: 3px;
        }
        .main-content p {
            font-size: 15px;
            line-height: 1.7;
            margin: 0 0 15px 0;
        }

        .sidebar-right {
            width: 280px;
            border: 1px solid #a2a9b1;
            background-color: #f8f9fa;
            padding: 15px;
            box-sizing: border-box;
            align-self: flex-start;
            flex-shrink: 0;
        }
        .item-title {
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            background-color: #eaecf0;
            padding: 6px;
            margin-bottom: 12px;
            border: 1px solid #a2a9b1;
        }
        .image-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid #ccccff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #72777d;
        }

        @media (max-width: 850px) {
            .wiki-wrapper {
                flex-direction: column;
            }
            .sidebar-left {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #a2a9b1;
            }
            .content-body {
                flex-direction: column;
                padding: 20px;
            }
            .sidebar-right {
                width: 100%;
                order: -1;
            }
        }
    </style>
</head>
<body>

    <div class="wiki-wrapper">
        
        <nav class="sidebar-left">
            <ul>
                <li><a href="vote.html">Voteについて</a></li>
                <li class="child-menu">┗ <a href="#">GoldCrateとは</a></li>
            </ul>
        </nav>

        <div class="content-body">
            
            <main class="main-content">
                <h1>GoldCrate</h1>
                <p>GoldCrateとはvoteをすることで貰えるアイテムで使用するとランダムで金が貰えます(平均5個)</p>
                <h2>GoldCrateの亜種</h2>
                <p>亜種としてGiantGoldCrateというものがあります使い方や見た目変わらずもらえる量が増えるだけです</p>
                <img src="../media/image/GoldCrate.png">
            </main>

            <aside class="sidebar-right">
                <div class="item-title">vote</div>
                    <div class="image-box">
                        <img src="../media/image/GoldCrate.png" alt="vote" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
            </aside>

        </div>

    </div>

</body>
</html>
