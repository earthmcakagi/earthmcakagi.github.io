<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイクラサーバー Wiki</title>
    <style>
        /* 全体の背景と文字の基本設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1b2a; /* 画像の背景に合わせた濃いネイビー */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* 3つのエリアを包むメインコンテナ */
        .wiki-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            background-color: #ffffff; /* パワポの白い背景 */
            padding: 20px;
            box-sizing: border-box;
            gap: 20px; /* エリア同士のすき間 */
            border-radius: 4px;
        }

        /* 左側：ナビゲーションメニュー */
        .sidebar-left {
            width: 20%;
            border-right: 1px solid #ccc;
            padding-right: 20px;
        }
        .sidebar-left ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-left li {
            margin-bottom: 10px;
        }
        .sidebar-left .child-menu {
            padding-left: 15px;
            color: #555;
        }

        /* 中央：メインコンテンツ（本文） */
        .main-content {
            width: 55%;
            padding: 0 10px;
        }
        .main-content h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .main-content h2 {
            font-size: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .main-content p {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }

        /* 右側：画像やアイテム情報 */
        .sidebar-right {
            width: 25%;
            border-left: 1px solid #ccc;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .item-title {
            font-weight: bold;
            font-size: 16px;
        }
        .image-box {
            width: 100%;
            aspect-ratio: 4 / 3; /* 画像の比率 */
            background-color: #f0f0f0;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #666;
        }

        /* スマホで見やすくするための設定（レスポンシブ） */
        @media (max-width: 768px) {
            .wiki-container {
                flex-direction: column;
            }
            .sidebar-left, .main-content, .sidebar-right {
                width: 100%;
                border: none;
                padding: 0;
            }
            .sidebar-left {
                border-bottom: 1px solid #ccc;
                padding-bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="wiki-container">
        
        <!-- 左サイドバー（メニュー） -->
        <nav class="sidebar-left">
            <ul>
                <li><a href="#">Voteについて</a></li>
                <li class="child-menu">┗ <a href="#">Voteのやり方とは</a></li>
            </ul>
        </nav>

        <!-- 中央の本文エリア -->
        <main class="main-content">
            <h1>Voteについて</h1>
            
            <h2>Voteやり方とは</h2>
            <p>マイクラにはいって/Voteと入力し出てきたリンクにアクセスし投票します</p>
        </main>

        <!-- 右サイドバー（画像エリア） -->
        <aside class="sidebar-right">
            <div class="item-title">ゴールデンクレート（画像に基づいた名前）</div>
            <!-- 実際に画像を使う時は、下の「画像」という文字の代わりに <img src="画像URL"> を入れます -->
            <div class="image-box">画像</div>
        </aside>

    </div>

</body>
</html>
