<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイクラサーバー Wiki</title>
    <style>
        /* 全体の基本設定（普通のWikiサイト風の白背景） */
        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #ffffff;
            color: #202122; /* Wikipedia等でよく使われる少し優しい黒 */
            margin: 0;
            padding: 0;
        }

        /* 画面全体に広がるレイアウトの枠組み */
        .wiki-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* 左側：ナビゲーションメニュー（普通のWiki風） */
        .sidebar-left {
            width: 220px; /* メニューの幅を固定 */
            background-color: #f6f6f6; /* 少しグレーにしてメニュー感を出します */
            border-right: 1px solid #a2a9b1;
            padding: 20px;
            box-sizing: border-box;
            flex-shrink: 0; /* 画面が狭くなっても潰れないように固定 */
        }
        .sidebar-left ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-left li {
            margin-bottom: 12px;
            font-size: 14px;
        }
        .sidebar-left a {
            color: #0645ad; /* Wiki特有の青色のリンク */
            text-decoration: none;
        }
        .sidebar-left a:hover {
            text-decoration: underline;
        }
        .sidebar-left .child-menu {
            padding-left: 15px;
            font-size: 13px;
            color: #54595d;
        }

        /* 中央と右側をまとめるエリア（画面の残りの幅をすべて使う） */
        .content-body {
            display: flex;
            flex-grow: 1;
            padding: 30px;
            gap: 30px;
            box-sizing: border-box;
        }

        /* 中央：メインコンテンツ（本文） */
        .main-content {
            flex-grow: 1; /* 空いているスペースをいっぱいに広げる */
            min-width: 0; /* 文字溢れ防止 */
        }
        .main-content h1 {
            font-size: 28px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #a2a9b1; /* Wikiっぽい細い区切り線 */
            padding-bottom: 5px;
        }
        .main-content h2 {
            font-size: 20px;
            font-weight: normal;
            margin-top: 30px;
            margin-bottom: 10px;
            border-bottom: 1px solid #eaecf0;
            padding-bottom: 3px;
        }
        .main-content p {
            font-size: 15px;
            line-height: 1.7;
            margin: 0 0 15px 0;
        }

        /* 右側：画像やアイテム情報（パワポの配置を再現） */
        .sidebar-right {
            width: 280px; /* 右側ボックスの幅 */
            border: 1px solid #a2a9b1;
            background-color: #f8f9fa;
            padding: 15px;
            box-sizing: border-box;
            align-self: flex-start; /* 縦にびよーんと伸びるのを防ぐ */
            flex-shrink: 0;
        }
        .item-title {
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            background-color: #eaecf0;
            padding: 6px;
            margin-bottom: 12px;
            border: 1px solid #a2a9b1;
        }
        .image-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid #ccccff; /* マイクラ画像が映える薄い枠線 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #72777d;
        }

        /* スマホで見やすくするための設定 */
        @media (max-width: 850px) {
            .wiki-wrapper {
                flex-direction: column;
            }
            .sidebar-left {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #a2a9b1;
            }
            .content-body {
                flex-direction: column;
                padding: 20px;
            }
            .sidebar-right {
                width: 100%;
                order: -1; /* スマホでは本文より上に画像を出す（お好みで） */
            }
        }
    </style>
</head>
<body>

    <div class="wiki-wrapper">
        
        <!-- 左ナビゲーション（メニュー） -->
        <nav class="sidebar-left">
            <ul>
                <li><a href="#">Voteについて</a></li>
                <li class="child-menu">┗ <a href="#">Voteのやり方とは</a></li>
            </ul>
        </nav>

        <!-- メインと右側を包むエリア -->
        <div class="content-body">
            
            <!-- 中央の本文エリア -->
            <main class="main-content">
                <h1>Voteについて</h1>
                
                <h2>Voteやり方とは</h2>
                <p>マイクラにはいって/Voteと入力し出てきたリンクにアクセスし投票します</p>
            </main>

            <!-- 右側の画像・情報エリア -->
            <aside class="sidebar-right">
                <div class="item-title">ゴールデンクレート</div>
                <!-- 実際の画像を入れる場合は <img src="画像ファイル名.png" width="100%"> に差し替えます -->
                <div class="image-box">画像</div>
            </aside>

        </div>

    </div>

</body>
</html>
